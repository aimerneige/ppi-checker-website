<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PPI Checker</title>
    <meta name="description" content="Check whether your image has enough resolution (PPI) for common print sizes." />
    <meta name="theme-color" content="#fef7ff" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved / system theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('ppi.theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app"></div>
    <input id="file-input" type="file" accept="image/*,.heic,.heif" hidden />
    <noscript><p style="padding:24px;font-family:sans-serif">PPI Checker needs JavaScript to read images locally.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
